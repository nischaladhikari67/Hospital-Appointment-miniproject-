<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments - NTN HEALTH CARE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
        }
        .dark-card {
            background: #111827;
            border: 1px solid #1f2937;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-xl text-xl"><i class="fa-solid fa-heart-pulse"></i></div>
            <span class="text-xl font-black tracking-tight text-white">NTN <span class="text-sky-400">HEALTH CARE</span></span>
        </div>
        <div class="flex gap-2">
            <a href="/" class="px-4 py-2 rounded-xl hover:bg-slate-800 text-slate-300 font-medium text-sm transition">Dashboard</a>
            <a href="/book" class="px-4 py-2 rounded-xl hover:bg-slate-800 text-slate-300 font-medium text-sm transition">Book Appointment</a>
            <a href="/view" class="px-4 py-2 rounded-xl bg-sky-500/20 text-sky-300 border border-sky-500/30 font-semibold text-sm transition">Manage Appointments</a>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto w-full p-6 mt-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-black text-white">Appointments List</h2>
                <p class="text-slate-400 text-sm">View, update status, or cancel scheduled appointments.</p>
            </div>
            <button onclick="loadAppointments()" class="px-4 py-2 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <div class="dark-card rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 border-b border-slate-800 uppercase text-xs text-slate-400 font-bold tracking-wider">
                        <tr>
                            <th class="p-4">Patient</th>
                            <th class="p-4">Doctor</th>
                            <th class="p-4">Date & Time</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTable" class="divide-y divide-slate-800/60">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function loadAppointments() {
            const tableBody = document.getElementById('appointmentTable');
            tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner animate-spin text-2xl"></i></td></tr>`;

            try {
                const res = await fetch('/api/appointments');
                const responseData = await res.json();

                if (responseData.status === 'success') {
                    const data = responseData.data;
                    if (data.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">No appointments found.</td></tr>`;
                        return;
                    }

                    tableBody.innerHTML = data.map(app => {
                        let statusBadge = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
                        if (app.status === 'Completed') statusBadge = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
                        if (app.status === 'Cancelled') statusBadge = 'bg-rose-500/20 text-rose-300 border-rose-500/30';

                        return `
                            <tr class="hover:bg-slate-900/50 transition">
                                <td class="p-4 font-bold text-white">${app.patient_name}</td>
                                <td class="p-4 text-slate-300">${app.doctor_name}</td>
                                <td class="p-4">${app.appointment_date} <span class="text-xs text-sky-400 font-semibold">@ ${app.appointment_time}</span></td>
                                <td class="p-4">
                                    <span class="px-3 py-1 rounded-full text-xs border font-semibold ${statusBadge}">
                                        ${app.status}
                                    </span>
                                </td>
                                <td class="p-4 text-right space-x-2">
                                    <button onclick="updateStatus(${app.id}, 'Completed')" class="px-3 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 text-xs font-semibold rounded-lg transition" title="Mark Completed">
                                        <i class="fa-solid fa-check"></i>
                                    </button>
                                    <button onclick="updateStatus(${app.id}, 'Cancelled')" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/40 text-amber-300 text-xs font-semibold rounded-lg transition" title="Mark Cancelled">
                                        <i class="fa-solid fa-ban"></i>
                                    </button>
                                    <button onclick="deleteAppointment(${app.id})" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 text-xs font-semibold rounded-lg transition" title="Delete">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-400 font-semibold">Failed to load appointments.</td></tr>`;
            }
        }

        async function updateStatus(id, status) {
            await fetch(`/api/appointments/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadAppointments();
        }

        async function deleteAppointment(id) {
            if (confirm('Are you sure you want to delete this appointment?')) {
                await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
                loadAppointments();
            }
        }

        document.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
</body>
</html>
