<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTN HEALTH CARE - Appointments List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes floatGlow {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -40px) scale(1.15); opacity: 0.55; }
    }
    .animate-glow-1 { animation: floatGlow 12s ease-in-out infinite; }
    .animate-glow-2 { animation: floatGlow 16s ease-in-out infinite reverse; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden font-sans">

  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl animate-glow-1"></div>
    <div class="absolute bottom-10 right-0 w-[28rem] h-[28rem] bg-indigo-600/20 rounded-full blur-3xl animate-glow-2"></div>
  </div>

  <main class="relative z-10 max-w-6xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <a href="/" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
      <a href="/book" class="bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-300 border border-cyan-500/30 px-4 py-2 rounded-lg transition-all flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Book New Appointment
      </a>
    </div>

    <div class="mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
        NTN HEALTH CARE - Appointment Management
      </h1>
      <p class="text-slate-400 text-sm mt-1">Manage patient schedules, descriptions, and statuses</p>
    </div>

    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
              <th class="p-4">Patient</th>
              <th class="p-4">Doctor</th>
              <th class="p-4">Date & Time</th>
              <th class="p-4">Symptoms / Description</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="appointmentTableBody" class="divide-y divide-slate-800/60 text-sm">
            <tr>
              <td colspan="6" class="text-center p-6 text-slate-500">Loading appointments...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function fetchAppointments() {
      try {
        const response = await fetch('/api/appointments');
        const res = await response.json();
        const tbody = document.getElementById('appointmentTableBody');
        tbody.innerHTML = '';

        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-slate-500">No appointments found.</td></tr>`;
          return;
        }

        res.data.forEach(item => {
          let statusBadge = '';
          if (item.status === 'Completed') {
            statusBadge = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Completed</span>';
          } else if (item.status === 'Cancelled') {
            statusBadge = '<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Cancelled</span>';
          } else {
            statusBadge = '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full text-xs font-semibold">Scheduled</span>';
          }

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-800/30 transition-colors";
          tr.innerHTML = `
            <td class="p-4 font-semibold text-white">${item.patient_name}</td>
            <td class="p-4 text-slate-300">${item.doctor_name}</td>
            <td class="p-4 text-slate-300">${item.appointment_date} <span class="text-slate-500 text-xs">(${item.appointment_time})</span></td>
            <td class="p-4 text-slate-400 text-xs max-w-xs truncate">${item.description || '<span class="text-slate-600">N/A</span>'}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 text-center">
              <div class="flex items-center justify-center gap-2">
                <button onclick="updateStatus(${item.id}, 'Completed')" title="Mark Completed" class="p-1.5 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 rounded-lg transition">
                  <i class="fa-solid fa-check"></i>
                </button>
                <button onclick="deleteAppointment(${item.id})" title="Delete Appointment" class="p-1.5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 rounded-lg transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function updateStatus(id, status) {
      await fetch(`/api/appointments/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      fetchAppointments();
    }

    async function deleteAppointment(id) {
      if (confirm('Are you sure you want to delete this appointment?')) {
        await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
        fetchAppointments();
      }
    }

    fetchAppointments();
  </script>
</body>
</html>
