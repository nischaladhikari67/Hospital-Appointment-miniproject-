<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NTN HEALTH CARE - System Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes floatGlow {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -40px) scale(1.15); opacity: 0.55; }
    }
    .animate-glow-1 { animation: floatGlow 12s ease-in-out infinite; }
    .animate-glow-2 { animation: floatGlow 16s ease-in-out infinite reverse; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden font-sans">

  <!-- Background Orbs -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-rose-500/20 rounded-full blur-3xl animate-glow-1"></div>
    <div class="absolute bottom-10 right-0 w-[28rem] h-[28rem] bg-cyan-600/20 rounded-full blur-3xl animate-glow-2"></div>
  </div>

  <main class="relative z-10 max-w-7xl mx-auto px-4 py-6">
    <!-- Navbar -->
    <div class="flex justify-between items-center mb-8 bg-slate-900/60 p-4 rounded-2xl border border-slate-800 backdrop-blur-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold">A</div>
        <div>
          <h2 class="font-bold text-white leading-tight">Admin Oversight Console</h2>
          <p class="text-xs text-rose-400">System Analytics & Control</p>
        </div>
      </div>
      <button onclick="logout()" class="px-3.5 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs rounded-xl border border-rose-500/30 transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
      </button>
    </div>

    <!-- Analytics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400">Total System Appointments</p>
        <p id="metricApps" class="text-3xl font-extrabold text-cyan-400 mt-1">0</p>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400">Registered Patients</p>
        <p id="metricPatients" class="text-3xl font-extrabold text-indigo-400 mt-1">0</p>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <p class="text-xs text-slate-400">Active Doctors</p>
        <p id="metricDoctors" class="text-3xl font-extrabold text-rose-400 mt-1">0</p>
      </div>
    </div>

    <!-- Live Graphical Visualizations -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <h4 class="text-xs font-bold text-slate-300 uppercase mb-4">Appointment Status Distribution</h4>
        <div class="h-64"><canvas id="statusChart"></canvas></div>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl">
        <h4 class="text-xs font-bold text-slate-300 uppercase mb-4">Doctor Workload Load</h4>
        <div class="h-64"><canvas id="doctorChart"></canvas></div>
      </div>
    </div>

    <!-- Global Appointments Monitoring Table -->
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-chart-line text-rose-400 mr-2"></i>Global Appointment Audit Stream</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950/60 text-slate-400 text-xs uppercase border-b border-slate-800">
              <th class="p-3">ID</th>
              <th class="p-3">Patient</th>
              <th class="p-3">Doctor</th>
              <th class="p-3">Date & Time</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-center">Admin Override</th>
            </tr>
          </thead>
          <tbody id="adminTable" class="divide-y divide-slate-800/60 text-xs">
            <tr><td colspan="6" class="p-4 text-slate-500 text-center">Loading audit records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let statusChartInst, doctorChartInst;

    async function loadAdminMetrics() {
      const res = await fetch('/api/admin/metrics');
      const data = await res.json();
      
      document.getElementById('metricApps').innerText = data.metrics.total_appointments;
      document.getElementById('metricPatients').innerText = data.metrics.total_patients;
      document.getElementById('metricDoctors').innerText = data.metrics.total_doctors;

      // Render Charts
      renderStatusChart(data.status_counts);
      renderDoctorChart(data.doctor_counts);

      // Render Table
      const tbody = document.getElementById('adminTable');
      tbody.innerHTML = '';
      data.appointments.forEach(a => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/30">
            <td class="p-3 font-mono text-slate-500">#${a.id}</td>
            <td class="p-3 font-semibold text-white">${a.patient_name}</td>
            <td class="p-3 text-slate-300">${a.doctor_name}</td>
            <td class="p-3 text-slate-400">${a.appointment_date} ${a.appointment_time}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded-full border text-[10px] bg-slate-800 border-slate-700">${a.status}</span></td>
            <td class="p-3 text-center">
              <button onclick="adminDelete(${a.id})" class="p-1.5 bg-rose-500/20 text-rose-300 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function renderStatusChart(statusCounts) {
      const ctx = document.getElementById('statusChart').getContext('2d');
      if(statusChartInst) statusChartInst.destroy();
      statusChartInst = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: statusCounts.map(s => s.status),
          datasets: [{
            data: statusCounts.map(s => s.count),
            backgroundColor: ['#06b6d4', '#10b981', '#f43f5e']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function renderDoctorChart(doctorCounts) {
      const ctx = document.getElementById('doctorChart').getContext('2d');
      if(doctorChartInst) doctorChartInst.destroy();
      doctorChartInst = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: doctorCounts.map(d => d.doctor_name),
          datasets: [{
            label: 'Appointments Assigned',
            data: doctorCounts.map(d => d.count),
            backgroundColor: '#6366f1'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    async function adminDelete(id) {
      if(confirm('Admin Delete: Permanently wipe this record?')) {
        await fetch(`/api/appointments/${id}`, {method: 'DELETE'});
        loadAdminMetrics();
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', {method: 'POST'});
      window.location.href = '/login';
    }

    loadAdminMetrics();
  </script>
</body>
</html>
