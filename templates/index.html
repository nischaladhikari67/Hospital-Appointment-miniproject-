<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CarePoint Hospital</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7fafc;
            text-align: center;
            padding-top: 5rem;
        }

        h1 {
            color: #2b6cb0;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #4a5568;
            margin-bottom: 2rem;
        }

        .nav-card {
            display: inline-block;
            background: white;
            padding: 2rem;
            margin: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 250px;
            text-decoration: none;
            color: #2d3748;
            transition: transform 0.2s;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            color: #2b6cb0;
        }

        .nav-card h2 {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <h1>🏥 CarePoint Health Center</h1>
    <p>Select an option below to proceed</p>

    <a href="/book" class="nav-card">
        <h2>📝 Book Appointment</h2>
        <p>Schedule a new visit with a specialist</p>
    </a>

    <a href="/view" class="nav-card">
        <h2>📋 Admin Dashboard</h2>
        <p>View and manage all scheduled appointments</p>
    </a>
</body>

</html>
