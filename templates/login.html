<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTN HEALTH CARE - Doctor & Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes floatGlow {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -40px) scale(1.15); opacity: 0.55; }
    }
    .animate-glow-1 { animation: floatGlow 12s ease-in-out infinite; }
    .animate-glow-2 { animation: floatGlow 16s ease-in-out infinite reverse; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden flex items-center justify-center p-4 font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Background Orbs -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl animate-glow-1"></div>
    <div class="absolute bottom-10 right-0 w-[28rem] h-[28rem] bg-rose-600/20 rounded-full blur-3xl animate-glow-2"></div>
  </div>

  <div class="relative z-10 w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <a href="/" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Patient Booking</a>
      <span class="text-xs text-indigo-400 font-semibold bg-indigo-950/60 px-2.5 py-1 rounded-md border border-indigo-500/20">Staff Access</span>
    </div>

    <!-- Switch Login / Register -->
    <div class="grid grid-cols-2 gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 mb-6 text-xs font-semibold">
      <button onclick="toggleMode('login')" id="mode-login" type="button" class="py-2.5 rounded-lg text-indigo-400 bg-indigo-950/60 border border-indigo-500/30 transition">Login</button>
      <button onclick="toggleMode('register')" id="mode-register" type="button" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition">Register Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Select Role</label>
        <select id="login_role" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <input type="text" id="login_username" required placeholder="Enter your username" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="login_password" required placeholder="••••••••" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full bg-gradient-to-r from-indigo-500 to-rose-500 hover:opacity-90 active:scale-[0.99] text-white font-semibold py-3 rounded-xl shadow-lg transition text-xs cursor-pointer">
        Access Portal
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Register As</label>
        <select id="reg_role" onchange="checkRegRole(this.value)" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-rose-500">
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
        <input type="text" id="reg_fullname" required placeholder="e.g. Dr. John Smith" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-rose-500">
      </div>

      <div id="specialty_box">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Specialty</label>
        <input type="text" id="reg_specialty" placeholder="e.g. Ophthalmologist" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-rose-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <input type="text" id="reg_username" required placeholder="Choose a unique username" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-rose-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="reg_password" required placeholder="Create a password" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-rose-500">
      </div>

      <button type="submit" id="regSubmitBtn" class="w-full bg-gradient-to-r from-rose-500 to-indigo-500 hover:opacity-90 active:scale-[0.99] text-white font-semibold py-3 rounded-xl shadow-lg transition text-xs cursor-pointer">
        Create Account
      </button>
    </form>
  </div>

  <script>
    function toggleMode(mode) {
      if (mode === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('mode-login').className = 'py-2.5 rounded-lg text-indigo-400 bg-indigo-950/60 border border-indigo-500/30 transition';
        document.getElementById('mode-register').className = 'py-2.5 rounded-lg text-slate-400 hover:text-white transition';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('mode-register').className = 'py-2.5 rounded-lg text-rose-400 bg-rose-950/60 border border-rose-500/30 transition';
        document.getElementById('mode-login').className = 'py-2.5 rounded-lg text-slate-400 hover:text-white transition';
      }
    }

    function checkRegRole(role) {
      document.getElementById('specialty_box').style.display = role === 'admin' ? 'none' : 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginBtn = document.getElementById('loginSubmitBtn');
      loginBtn.disabled = true;
      loginBtn.innerText = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            role: document.getElementById('login_role').value,
            username: document.getElementById('login_username').value,
            password: document.getElementById('login_password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = `/${data.role}`;
        } else {
          alert(data.message || 'Login failed.');
        }
      } catch (err) {
        alert('Server error: Unable to connect.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Access Portal';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const regBtn = document.getElementById('regSubmitBtn');
      regBtn.disabled = true;
      regBtn.innerText = 'Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            role: document.getElementById('reg_role').value,
            full_name: document.getElementById('reg_fullname').value,
            specialty: document.getElementById('reg_specialty').value,
            username: document.getElementById('reg_username').value,
            password: document.getElementById('reg_password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Account registered! You can now log in.');
          toggleMode('login');
        } else {
          alert(data.message || 'Registration failed.');
        }
      } catch (err) {
        alert('Server error: Unable to connect.');
      } finally {
        regBtn.disabled = false;
        regBtn.innerText = 'Create Account';
      }
    });
  </script>
</body>
</html>
